<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Majestic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; height: 100vh; background: #0f0f1a; color: #eee; font-family: sans-serif; }
    canvas { border: 1px solid #333; }
    .panel { padding: 16px; width: 260px; overflow-y: auto; }
    .panel h3 { margin-bottom: 8px; font-size: 14px; }
    .panel h4 { margin: 12px 0 4px; font-size: 13px; color: #aaa; }
    button { display: block; width: 100%; margin: 3px 0; padding: 6px; background: #2a2a3e; color: #eee; border: 1px solid #444; cursor: pointer; font-size: 13px; }
    button:hover { background: #3a3a5e; }
    .inv { font-size: 12px; color: #8f8; margin-top: 4px; }
    .status { font-size: 12px; color: #888; margin-top: 12px; }
    #invSection { display: none; }
  </style>
</head>
<body>
  <canvas id="world" width="800" height="600"></canvas>
  <div class="panel">
    <h4>World</h4>
    <button onclick="sendRaw({cmd:'spawnPlayer'})">Spawn Player</button>
    <button onclick="sendRaw({cmd:'spawnItem'})">Spawn Item</button>
    <div id="invSection">
      <h3>Inventory</h3>
      <div class="inv" id="inv">—</div>
    </div>
    <h4>Give</h4>
    <button onclick="send({cmd:'giveItem',itemType:'medkit'})">Medkit</button>
    <button onclick="send({cmd:'giveItem',itemType:'bandage'})">Bandage</button>
    <button onclick="send({cmd:'giveItem',itemType:'armor'})">Armor</button>
    <button onclick="send({cmd:'giveItem',itemType:'flare'})">Flare</button>
    <h4>Use</h4>
    <button onclick="useItem('medkit')">Use Medkit</button>
    <button onclick="useItem('bandage')">Use Bandage</button>
    <button onclick="useItem('armor')">Use Armor</button>
    <button onclick="useItem('flare')">Use Flare</button>
    <h4>Drop</h4>
    <button onclick="dropItem('medkit')">Drop Medkit</button>
    <button onclick="dropItem('bandage')">Drop Bandage</button>
    <button onclick="dropItem('armor')">Drop Armor</button>
    <button onclick="dropItem('flare')">Drop Flare</button>
    <p class="status">LMB player — control | LMB field — move | RMB — inventory</p>
    <p class="status" id="status">connecting...</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
